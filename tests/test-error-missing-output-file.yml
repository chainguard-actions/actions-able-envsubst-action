name: Test error handling when input-file is set but output-file is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set env vars for substitution
        run: |
          echo "MY_VAR=test" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          working-directory: ${{ github.workspace }}/tests/fixtures/single
          input-file: config.tmpl
          # output-file intentionally omitted — should fail
        continue-on-error: true

      - name: Assert action failed due to missing output-file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when input-file is set but output-file is missing, but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when output-file was not provided alongside input-file"
