name: Test validation error - missing input-file and input-file-pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run envsubst action without required input-file or input-file-pattern
        id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: ${{ github.workspace }}

      - name: Assert action failed due to missing inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when neither input-file nor input-file-pattern is provided, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with missing required inputs"
