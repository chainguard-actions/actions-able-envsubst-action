name: Test validation error when no input file specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          working-directory: "."
          # Intentionally omitting both input-file and input-file-pattern
          # to trigger the validation error
        continue-on-error: true

      - name: Assert action failed with validation error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when neither input-file nor input-file-pattern is provided, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when required inputs were missing"
