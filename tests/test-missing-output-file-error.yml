name: Test validation error when input-file given but output-file missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create input file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp-missing-out"
          echo "key=$VALUE" > "$GITHUB_WORKSPACE/tests/tmp-missing-out/input.tmpl"

      - id: action
        uses: .
        with:
          working-directory: ${{ github.workspace }}/tests/tmp-missing-out
          input-file: input.tmpl
          # Intentionally omitting output-file to trigger validation error
        continue-on-error: true
        env:
          VALUE: test

      - name: Assert action failed with validation error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when input-file is set but output-file is missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when output-file was not provided alongside input-file"
