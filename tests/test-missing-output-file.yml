name: Test validation error - input-file without output-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create input file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp-missing-out"
          echo "Hello, \${NAME}!" > "$GITHUB_WORKSPACE/tests/tmp-missing-out/template.txt"

      - name: Run envsubst action with input-file but no output-file
        id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: ${{ github.workspace }}/tests/tmp-missing-out
          input-file: template.txt

      - name: Assert action failed due to missing output-file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when input-file is set but output-file is missing, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with missing output-file"

      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/tests/tmp-missing-out"
