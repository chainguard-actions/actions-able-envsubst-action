name: Test default output-file-suffix with pattern substitution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run envsubst action using default output-file-suffix (.subst)
        id: action
        uses: .
        env:
          DATABASE_URL: "postgres://localhost:5432/mydb"
          API_KEY: "secret-key-12345"
        with:
          working-directory: tests/fixtures/default-suffix
          input-file-pattern: "*.template"

      - name: Assert output file was created with default .subst suffix
        run: |
          OUTPUT_FILE="$GITHUB_WORKSPACE/tests/fixtures/default-suffix/app.env.template.subst"
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "FAIL: output file app.env.template.subst was not created (default suffix .subst not applied)"
            exit 1
          fi
          echo "Output file contents:"
          cat "$OUTPUT_FILE"
          if ! grep -q "DATABASE_URL=postgres://localhost:5432/mydb" "$OUTPUT_FILE"; then
            echo "FAIL: expected DATABASE_URL to be substituted"
            exit 1
          fi
          if ! grep -q "API_KEY=secret-key-12345" "$OUTPUT_FILE"; then
            echo "FAIL: expected API_KEY to be substituted"
            exit 1
          fi
          echo "PASS: default .subst suffix was applied and variables were substituted"
